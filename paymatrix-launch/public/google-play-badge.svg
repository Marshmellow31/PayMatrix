<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="540" height="160">
  <defs>
    <linearGradient id="gp_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C0FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <linearGradient id="gp_green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F076"/>
      <stop offset="100%" stop-color="#00A843"/>
    </linearGradient>
    <linearGradient id="gp_yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDE00"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>
    <linearGradient id="gp_red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3A44"/>
      <stop offset="100%" stop-color="#C31162"/>
    </linearGradient>
  </defs>

  <!-- Container badge background -->
  <rect x="2" y="2" width="536" height="156" rx="36" fill="#000000" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>

  <!-- Google Play Color Triangle Icon -->
  <g transform="translate(48, 32)">
    <!-- Blue polygon (left) -->
    <path d="M5.4 3.2 C2.4 4.8 0.5 8.1 0.5 12.3 L0.5 83.7 C0.5 87.9 2.4 91.2 5.4 92.8 L48.8 48 Z" fill="url(#gp_blue)"/>
    <!-- Yellow/Green polygon (bottom) -->
    <path d="M63.2 34.4 L48.8 48 L63.2 61.6 L79.5 52.4 C84.8 49.4 84.8 46.6 79.5 43.6 Z" fill="url(#gp_yellow)"/>
    <!-- Red polygon (top-right) -->
    <path d="M5.4 92.8 L48.8 48 L63.2 61.6 L21.6 85.2 C15.8 88.5 10.3 91.1 5.4 92.8 Z" fill="url(#gp_red)"/>
    <!-- Green polygon (top-left/top) -->
    <path d="M5.4 3.2 C10.3 4.9 15.8 7.5 21.6 10.8 L63.2 34.4 L48.8 48 Z" fill="url(#gp_green)"/>
  </g>

  <!-- Badge Text -->
  <!-- "GET IT ON" -->
  <text x="160" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#D0D0D0" letter-spacing="1.2">GET IT ON</text>

  <!-- "Google Play" -->
  <text x="158" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">Google Play</text>
</svg>
